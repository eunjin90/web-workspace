<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>후기 작성</title>
</head>
<body>

<header>
    <h1>영화 후기 작성</h1>
</header>

<main>
    <section>
        <form>

            <label>이름:</label><br>
            <input type="text"><br><br>

            <label>영화 선택:</label><br>
            <select>
                <option>컨저링</option>
                <option>인시디어스</option>
            </select><br><br>

            <label>평점:</label><br>
            <input type="radio" name="rating">5점
            <input type="radio" name="rating">4점
            <input type="radio" name="rating">3점<br><br>

            <label>후기:</label><br>
            <textarea rows="5" cols="30"></textarea><br><br>

            <button type="submit">제출</button>

        </form>
    </section>
</main>

<footer>
    <a href="../index.html">메인으로 돌아가기</a>
</footer>

</body>
</html>
